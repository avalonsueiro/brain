# A restart must drain in-flight turns, not kill them.
#
# The default (KillMode=control-group) delivers KillSignal -- SIGTERM here -- to
# every process in the cgroup, so the `claude` subprocesses get signalled
# directly, mid-turn, alongside the daemon (and SIGKILLed after TimeoutStopSec).
# `mixed` sends it to the main process only, letting the daemon's own drain path
# finish live turns before it exits.
[Service]
KillMode=mixed
